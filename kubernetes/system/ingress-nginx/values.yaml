controller:
  replicaCount: 1

  # NodePort instead of LoadBalancer (local environment without MetalLB)
  service:
    type: NodePort
    nodePorts:
      http: "30080"
      https: "30443"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Webhooks disabled to simplify installation in a local environment
  admissionWebhooks:
    enabled: false

  metrics:
    enabled: true
    serviceMonitor:
      # Enable when Prometheus is installed in the monitoring namespace
      enabled: false
      namespace: monitoring

  # Ensures the pod is scheduled even on a single-node cluster with taints
  tolerations: []

  # Global NGINX options configmap
  config:
    # Expose the real client IP in logs (useful behind a reverse proxy)
    use-forwarded-headers: "true"
    # Maximum request body size for uploads (e.g. LLM models)
    proxy-body-size: "100m"
